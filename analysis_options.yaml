# Static analysis for AniLocal. `flutter analyze` treats infos as fatal, so
# every rule here is a build gate, not a suggestion. The set is chosen for the
# failure modes this codebase has actually had (see CLAUDE.md's anti-debt
# rules): futures dropped on the floor, subscriptions never cancelled,
# `dynamic` reaching a cast.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A TODO is a promise with no owner; it fails the gate until it is either
    # done or written into ROADMAP.md. (Generated code is exempt through its
    # own ignore_for_file.)
    todo: warning
  exclude:
    - build/**
    - macos/**

linter:
  rules:
    # Async discipline — a dropped Future is a silent failure.
    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    # Type discipline.
    - avoid_dynamic_calls
    - always_declare_return_types
    - prefer_final_locals
    - prefer_final_in_for_each
    - only_throw_errors
    - throw_in_finally
    # Style that the formatter cannot enforce on its own.
    - require_trailing_commas
    - directives_ordering
    - sort_pub_dependencies
    - comment_references
