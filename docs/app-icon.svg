<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F46"/>
      <stop offset="1" stop-color="#1C1F24"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <!-- chassis: Apple's icon grid leaves ~10% margin; 824px body centred -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bezel)"/>
  <rect x="112" y="112" width="800" height="800" rx="176" fill="#0B0C0E"/>
  <!-- the VFD screen -->
  <rect x="168" y="238" width="688" height="548" rx="40" fill="#000000"/>
  <rect x="168" y="238" width="688" height="548" rx="40" fill="none" stroke="#2A2E34" stroke-width="6"/>
  <!-- play glyph, lit, with bloom -->
  <polygon points="420,340 420,620 660,480" fill="#A6F2FF" opacity="0.55" filter="url(#glow)"/>
  <polygon points="420,340 420,620 660,480" fill="#93C6CC"/>
  <!-- segmented level meter: lit cells, a bright peak, unlit ahead -->
  <g>
    <rect x="228" y="690" width="34" height="48" fill="#93C6CC"/>
    <rect x="272" y="690" width="34" height="48" fill="#93C6CC"/>
    <rect x="316" y="690" width="34" height="48" fill="#93C6CC"/>
    <rect x="360" y="690" width="34" height="48" fill="#93C6CC"/>
    <rect x="404" y="690" width="34" height="48" fill="#93C6CC"/>
    <rect x="448" y="690" width="34" height="48" fill="#93C6CC"/>
    <rect x="492" y="690" width="34" height="48" fill="#93C6CC"/>
    <rect x="536" y="690" width="34" height="48" fill="#93C6CC"/>
    <rect x="580" y="690" width="34" height="48" fill="#A6F2FF" opacity="0.6" filter="url(#glow)"/>
    <rect x="580" y="690" width="34" height="48" fill="#A6F2FF"/>
    <rect x="624" y="690" width="34" height="48" fill="#1A2A2D"/>
    <rect x="668" y="690" width="34" height="48" fill="#1A2A2D"/>
    <rect x="712" y="690" width="34" height="48" fill="#1A2A2D"/>
    <rect x="756" y="690" width="34" height="48" fill="#1A2A2D"/>
  </g>
</svg>
