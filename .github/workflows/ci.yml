name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The token only reads the checkout; nothing here pushes, comments or
# releases. Stated so an org-level default can never widen it.
permissions:
  contents: read

# Pinned, not `stable`: test/goldens are rasterised by the engine, so they
# hold only for the SDK that generated them. Bumping this regenerates the
# goldens in the same commit. ONE place, read by every job.
env:
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    name: format · analyze · test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: ./tool/check.sh
      # The committed Drift code must match what the generator emits, or the
      # schema in the repo and the schema in the build silently diverge.
      - name: generated code is fresh
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'
      # A report, not a gate: the number is printed in the log and the lcov
      # file kept as an artifact. See tool/coverage.sh for why there is no
      # threshold.
      - name: coverage
        run: ./tool/coverage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: coverage/lcov.info
          # A coverage report is useful for days, not the 90-day default.
          retention-days: 14

  build:
    # Separate jobs: `pod install` curls the libmpv xcframeworks on a cold
    # machine (documented in CLAUDE.md), so this needs network the check job
    # does not, and a build failure should not mask a test failure. One job
    # per desktop platform: Windows and Linux compile the same Dart against
    # their own runners, which is how the platform seams (ARCHITECTURE.md)
    # stay honest — nothing is packaged or signed here.
    name: build ${{ matrix.label }} (debug)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS
            build: flutter build macos --debug
          - os: windows-latest
            label: Windows
            build: flutter build windows --debug
          - os: ubuntu-latest
            label: Linux
            build: flutter build linux --debug
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # media_kit_libs_linux links the distro's libmpv (it does not bundle
      # one — a Linux package must depend on it too); the GTK dev headers
      # and ninja are Flutter's own Linux desktop prerequisites.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      - run: ${{ matrix.build }}
