name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · analyze · test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `stable`: test/goldens are rasterised by the engine,
          # so they hold only for the SDK that generated them. Bumping this
          # regenerates the goldens in the same commit.
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - run: ./tool/check.sh
      # The committed Drift code must match what the generator emits, or the
      # schema in the repo and the schema in the build silently diverge.
      - name: generated code is fresh
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'
      # A report, not a gate: the number is printed in the log and the lcov
      # file kept as an artifact. See tool/coverage.sh for why there is no
      # threshold.
      - name: coverage
        run: ./tool/coverage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: coverage/lcov.info

  build:
    # Separate job: `pod install` curls the libmpv xcframeworks on a cold
    # machine (documented in CLAUDE.md), so this needs network the check job
    # does not, and a build failure should not mask a test failure.
    name: build macOS (debug)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `stable`: test/goldens are rasterised by the engine,
          # so they hold only for the SDK that generated them. Bumping this
          # regenerates the goldens in the same commit.
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - run: flutter build macos --debug
