name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · analyze · test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ./tool/check.sh
      # The committed Drift code must match what the generator emits, or the
      # schema in the repo and the schema in the build silently diverge.
      - name: generated code is fresh
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'

  build:
    # Separate job: `pod install` curls the libmpv xcframeworks on a cold
    # machine (documented in CLAUDE.md), so this needs network the check job
    # does not, and a build failure should not mask a test failure.
    name: build macOS (debug)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --debug
